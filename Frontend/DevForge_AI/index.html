<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Apply the saved preference before the first paint to avoid a light flash.
      (() => {
        let theme
        try { theme = localStorage.getItem('devforge-theme') } catch {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        }
        document.documentElement.dataset.theme = theme
      })()
    </script>
    <meta name="theme-color" content="#4c70f0" />
    <meta name="description" content="DevForge AI — your AI engineering workspace. Bring projects, agents, and ideas together." />
    <title>DevForge AI — Your engineering workspace</title>
  </head>
  <body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body>
</html>
